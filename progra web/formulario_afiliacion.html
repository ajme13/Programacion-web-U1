<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <header>
        <h1>Supermerado</h1>
    </header>

    <nav>
        <ul>
            <li>
                <a href="/progra web/index.html">Inicio</a>
            </li>

            <li>

                <a href="/progra web/formulario_afiliacion.html">Formulario de afiliacion</a>
            </li>
        </ul>
    </nav>

    <main>
        <h2>Formulario de afiliacion de cliente</h2>

        <form action="afiliados.php" method="post" enctype="multipart/form-data"> <!--action apunta al backend(post es el metodo recomendado) -->

            <fieldset>
                <legend>Datos personales</legend>
                <div>
                    <label>Ingrese su nombre</label>
                    <input type="text" name="Nombre" id="nombre" required placeholder="Ingrese su nombre y apellido" minlength="10" maxlength="100">

                    <label>Ingrese su DNI</label>
                    <input type="text" name="DNI" id="dni" required placeholder="Ingrese su numero de identidad" minlength="13" maxlength="13" pattern="[0-9]{4}-[0-9]{4}-[0-9]{5}">

                    <label>Ingrese su numero de telefono</label>
                    <input type="tel" name="Telefono" id="telefono" required placeholder="Ingrese su numero de telefono" minlength="11" maxlength="11">

                    <label>Ingrese su fecha de nacimiento</label>
                    <input type="date" name="FechaNac" id="fechanac" required placeholder="Ingrese su fecha de nacimiento" minlength="1945-01-01" maxlength="2008-01-01">

                    <label>Ingrese su direccion</label>
                    <input type="text" name="Direccion" id="direccion" required placeholder="Ingrese su direccion" minlength="11" maxlength="500">
                </div>
            </fieldset>

            <fieldset>
                <legend>Informacion de compra</legend>
                <div>
                    <label>Seleccione: </label>
                    <select name="Sucursal" id="sucursal">
                        <option selected>Blvd. Morazan</option>
                        <option>City Mall</option>
                        <option>Mall Premier</option>
                    </select>
                </div>
            </fieldset>

        </form>
    </main>
    
</body>
</html>
